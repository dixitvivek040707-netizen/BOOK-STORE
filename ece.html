<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>ECE Books</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="content">
  <h2>ECE Books</h2>
  <table class="books">
   <tr><th>Cover</th><th>Book Details</th><th>Price</th><th>Cart</th></tr>
   <tr>
    <td><img class="cover" src="cover_ece.png" alt="Electronic Devices cover"></td>
    <td>Book: Electronic Devices<br>Author: Boylestad<br>Publication: Pearson</td>
    <td class="price">$45</td>
    <td><button class="btn" onclick="alert('Electronic Devices added to cart')">Add to cart</button></td>
   </tr>
   <tr>
    <td><img class="cover" src="cover_dd.png" alt="Digital Design cover"></td>
    <td>Book: Digital Design<br>Author: Morris Mano<br>Publication: Pearson</td>
    <td class="price">$38.5</td>
    <td><button class="btn" onclick="alert('Digital Design added to cart')">Add to cart</button></td>
   </tr>
  </table>
 </div>
</body>
</html>
