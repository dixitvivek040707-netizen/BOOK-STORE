<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Catalogue</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="content">
  <h2>Catalogue</h2>
  <table class="books">
   <tr><th>Cover</th><th>Book Details</th><th>Price</th><th>Cart</th></tr>
   <tr>
    <td><img class="cover" src="cover_xml.png" alt="XML Bible cover"></td>
    <td>Book: XML Bible<br>Author: Winston<br>Publication: Wiely</td>
    <td class="price">$40.5</td>
    <td><button class="btn" onclick="alert('XML Bible added to cart')">Add to cart</button></td>
   </tr>
   <tr>
    <td><img class="cover" src="cover_ai.png" alt="AI cover"></td>
    <td>Book: AI<br>Author: S.Russel<br>Publication: Princetonhall</td>
    <td class="price">$63</td>
    <td><button class="btn" onclick="alert('AI added to cart')">Add to cart</button></td>
   </tr>
   <tr>
    <td><img class="cover" src="cover_java.png" alt="Java 2 cover"></td>
    <td>Book: Java 2<br>Author: Watson<br>Publication: BPBpublications</td>
    <td class="price">$35.5</td>
    <td><button class="btn" onclick="alert('Java 2 added to cart')">Add to cart</button></td>
   </tr>
   <tr>
    <td><img class="cover" src="cover_html.png" alt="HTML in 24 hours cover"></td>
    <td>Book: HTML in 24 hours<br>Author: Sam Peter<br>Publication: Sampublication</td>
    <td class="price">$50</td>
    <td><button class="btn" onclick="alert('HTML in 24 hours added to cart')">Add to cart</button></td>
   </tr>
  </table>
 </div>
</body>
</html>
