<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageTurner Engineering Bookstore</title>
  <style>
    :root{
      --bg:#f7f3ee; --card:#fff; --text:#24201d; --muted:#746c65;
      --accent:#6b4f3a; --accent2:#b98254; --line:#e7ddd4;
      --shadow:0 10px 30px rgba(54,39,29,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .nav{max-width:1150px;margin:auto;padding:18px 22px;display:flex;align-items:center;gap:20px}
    .brand{font-family:Georgia,serif;font-size:25px;font-weight:700;color:var(--accent);margin-right:auto}
    .cart-btn{border:0;background:var(--accent);color:#fff;padding:10px 15px;border-radius:10px;cursor:pointer}
    .hero{max-width:1150px;margin:35px auto 25px;padding:40px 28px;background:linear-gradient(135deg,#ead9c8,#f8eee4);border-radius:22px}
    .hero h1{font:700 44px Georgia,serif;margin:0 0 10px}
    .hero p{max-width:600px;color:var(--muted);font-size:17px;margin:0}
    .controls{max-width:1150px;margin:0 auto 24px;padding:0 22px;display:flex;gap:12px;flex-wrap:wrap}
    .search{flex:1;min-width:230px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
    select{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .grid{max-width:1150px;margin:auto;padding:0 22px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:20px}
    .book{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
    .cover{height:245px;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;color:#fff;font:700 25px Georgia,serif}
    .book-info{padding:16px;display:flex;flex-direction:column;flex:1}
    .book h3{margin:0 0 5px;font:700 19px Georgia,serif}
    .author{color:var(--muted);font-size:14px;margin-bottom:10px}
    .category{font-size:12px;color:var(--accent);background:#f1e8df;padding:4px 8px;border-radius:20px;display:inline-block;align-self:flex-start;margin-bottom:14px}
    .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
    .price{font-weight:700}
    .add{border:0;background:var(--accent);color:#fff;padding:8px 11px;border-radius:8px;cursor:pointer}
    .add:hover,.cart-btn:hover{background:#503a2b}
    .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
    .overlay.open{display:block}
    .cart{position:absolute;right:0;top:0;height:100%;width:min(410px,100%);background:#fff;padding:25px;display:flex;flex-direction:column}
    .cart-head{display:flex;justify-content:space-between;align-items:center}
    .cart-head h2{font:700 27px Georgia,serif}
    .close{border:0;background:#eee;border-radius:8px;width:35px;height:35px;cursor:pointer}
    #cartItems{overflow:auto;flex:1;margin:15px 0}
    .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
    .mini{width:52px;height:65px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
    .item-main{flex:1}.item-main strong{display:block}.item-main small{color:var(--muted)}
    .qty{display:flex;gap:7px;align-items:center;margin-top:7px}
    .qty button{border:1px solid var(--line);background:#fff;border-radius:5px;width:25px;height:25px;cursor:pointer}
    .remove{border:0;background:none;color:#a04d42;cursor:pointer;font-size:12px}
    .total{border-top:1px solid var(--line);padding-top:16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between}
    .checkout{margin-top:14px;border:0;background:var(--accent);color:#fff;padding:13px;border-radius:9px;cursor:pointer;width:100%}

    /* Animated UI polish */
    html{scroll-behavior:smooth}
    body{overflow-x:hidden}
    header{animation:slideDown .65s ease both}
    .hero{position:relative;overflow:hidden;animation:fadeUp .7s ease both}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;pointer-events:none}
    .hero:before{width:180px;height:180px;background:#fff;right:7%;top:-80px;animation:float 5s ease-in-out infinite}
    .hero:after{width:110px;height:110px;background:#d5b393;right:28%;bottom:-60px;animation:float 6s ease-in-out infinite reverse}
    .hero h1,.hero p{position:relative;z-index:1}
    .controls{animation:fadeUp .85s ease both}
    .search,select{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .search:focus,select:focus{transform:translateY(-2px);border-color:var(--accent2);box-shadow:0 5px 18px rgba(107,79,58,.12)}
    .book{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s ease,box-shadow .25s ease}
    .book:hover{transform:translateY(-8px) rotateX(1deg);box-shadow:0 18px 38px rgba(54,39,29,.15)}
    .cover{position:relative;overflow:hidden;transition:transform .35s ease}
    .book:hover .cover{transform:scale(1.035)}
    .cover:after{content:"";position:absolute;inset:-80% -30%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-80%) rotate(10deg);transition:transform .6s ease}
    .book:hover .cover:after{transform:translateX(80%) rotate(10deg)}
    .add,.cart-btn,.checkout{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
    .add:hover,.cart-btn:hover,.checkout:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(80,58,43,.22)}
    .add:active,.cart-btn:active,.checkout:active{transform:scale(.96)}
    .overlay{backdrop-filter:blur(3px)}
    .cart{animation:cartIn .3s ease both}
    .cart-item{animation:fadeUp .25s ease both}
    @keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes cartIn{from{transform:translateX(100%)}to{transform:none}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
    @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.45)}60%{transform:scale(.9)}100%{transform:scale(1)}}
    .bump{animation:bump .38s ease}
    @keyframes popIn{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
    @keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px) scale(.9)}}
    .toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:40;font-size:14px;display:flex;align-items:center;gap:8px;animation:popIn .25s ease both}
    .toast.hide{animation:popOut .25s ease both}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .shake{animation:shake .4s ease}
    @keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
    .cart-item.removing{animation:popOut .2s ease both}
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
    @media(max-width:600px){.hero{margin:20px 15px;padding:30px 22px}.hero h1{font-size:35px}.controls,.grid{padding-left:15px;padding-right:15px}}
  </style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">📐 PageTurner Engineering</div>
    <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Build your engineering shelf.</h1>
    <p>Explore hand-picked engineering textbooks — with a smoother, more playful shopping experience.</p>
  </section>

  <div class="controls">
    <input class="search" id="search" placeholder="Search by title or author..." oninput="renderBooks()">
    <select id="category" onchange="renderBooks()">
      <option value="All">All engineering branches</option>
      <option>Mechanical</option><option>Electrical</option>
      <option>Civil</option><option>Mathematics</option>
    </select>
  </div>

  <section class="grid" id="bookGrid"></section>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
  <aside class="cart">
    <div class="cart-head"><h2>Your Cart</h2><button class="close" onclick="closeCart()">✕</button></div>
    <div id="cartItems"></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
    <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
  </aside>
</div>

<script>
const books = [
  {id:9,title:"Engineering Mechanics",author:"R. S. Khurmi",category:"Mechanical",price:649,color:"#375a7f"},
  {id:10,title:"Electrical Technology",author:"B. L. Theraja",category:"Electrical",price:749,color:"#8a5a44"},
  {id:11,title:"Fluid Mechanics",author:"R. K. Rajput",category:"Mechanical",price:699,color:"#39706b"},
  {id:12,title:"Engineering Mathematics",author:"B. S. Grewal",category:"Mathematics",price:799,color:"#6a4d7c"},
  {id:13,title:"Strength of Materials",author:"R. K. Bansal",category:"Mechanical",price:629,color:"#4a6b3a"},
  {id:14,title:"Basic Electrical Engineering",author:"D. P. Kothari",category:"Electrical",price:579,color:"#7c4d5a"},
  {id:15,title:"Surveying Vol. 1",author:"B. C. Punmia",category:"Civil",price:559,color:"#5a7c4d"},
  {id:16,title:"Theory of Structures",author:"S. Ramamrutham",color:"#7a5a3d",category:"Civil",price:689},
  {id:17,title:"Thermodynamics: An Engineering Approach",author:"Cengel & Boles",category:"Mechanical",price:899,color:"#3d5a7a"},
  {id:18,title:"Higher Engineering Mathematics",author:"B. V. Ramana",category:"Mathematics",price:749,color:"#5a3d7a"},
  {id:19,title:"Power System Engineering",author:"D. Kothari & I. Nagrath",category:"Electrical",price:819,color:"#3d7a6b"},
  {id:20,title:"Reinforced Concrete Design",author:"N. Krishna Raju",category:"Civil",price:659,color:"#7a3d4d"}
];

let cart = JSON.parse(localStorage.getItem("bookCart") || "{}");
// Drop any leftover cart entries that no longer match the current catalog
Object.keys(cart).forEach(id => { if(!books.some(b => b.id == id)) delete cart[id]; });

const money = n => "₹" + n.toLocaleString("en-IN");

function renderBooks(){
  const q = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("category").value;
  const filtered = books.filter(b =>
    (cat==="All" || b.category===cat) &&
    (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q))
  );
  document.getElementById("bookGrid").innerHTML = filtered.length ? filtered.map((b,i) => `
    <article class="book" style="animation-delay:${Math.min(i*55,440)}ms">
      <div class="cover" style="background:${b.color}">${b.title}</div>
      <div class="book-info">
        <span class="category">${b.category}</span>
        <h3>${b.title}</h3>
        <div class="author">by ${b.author}</div>
        <div class="bottom">
          <span class="price">${money(b.price)}</span>
          <button class="add" onclick="addToCart(${b.id})">Add to cart</button>
        </div>
      </div>
    </article>`).join("") : `<div class="empty">No books found. Try another search.</div>`;
}

function save(){ localStorage.setItem("bookCart", JSON.stringify(cart)); }

function showToast(msg){
  const existing = document.querySelector(".toast");
  if(existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `✅ ${msg}`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add("hide"); setTimeout(()=>t.remove(),250); }, 1400);
}

function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  save(); updateCart();
  const b = books.find(x=>x.id===id);
  showToast(`${b.title} added to cart`);
  const badge = document.getElementById("cartCount");
  badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump");
}

function changeQty(id, delta){
  cart[id] = (cart[id] || 0) + delta;
  if(cart[id] <= 0) delete cart[id];
  save(); updateCart();
}

function removeItem(id){ delete cart[id]; save(); updateCart(); }

function updateCart(){
  let count=0,total=0;
  const html = Object.entries(cart).map(([id,qty])=>{
    const b=books.find(x=>x.id==id); count+=qty; total+=b.price*qty;
    return `<div class="cart-item">
      <div class="mini" style="background:${b.color}">${b.title}</div>
      <div class="item-main"><strong>${b.title}</strong><small>${money(b.price)} each</small>
      <div class="qty"><button onclick="changeQty(${b.id},-1)">−</button><span>${qty}</span><button onclick="changeQty(${b.id},1)">+</button>
      <button class="remove" onclick="removeItem(${b.id})">Remove</button></div></div>
    </div>`;
  }).join("");
  document.getElementById("cartItems").innerHTML = html || '<div class="empty">Your cart is empty.</div>';
  document.getElementById("cartCount").textContent=count;
  document.getElementById("total").textContent=money(total);
}

function openCart(){ updateCart(); document.getElementById("overlay").classList.add("open"); }
function closeCart(){ document.getElementById("overlay").classList.remove("open"); }
function checkout(){
  if(Object.keys(cart).length===0){
    const panel = document.querySelector(".cart");
    panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
    showToast("Your cart is empty");
    return;
  }
  showToast("Order placed — thanks for shopping!");
  cart = {}; save(); updateCart();
  setTimeout(closeCart, 900);
}

renderBooks(); updateCart();
</script>
</body>
</html>
